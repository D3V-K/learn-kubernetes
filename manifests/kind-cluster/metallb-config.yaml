apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kindcluster-pool
  namespace: metallb-system
spec:
  addresses:
    - POOL_START-POOL_END
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kindcluster-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - kindcluster-pool
